<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>羽球分組表</title>
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#1c2220;--muted:#66706b;--line:#dce1dc;--accent:#1f7a4d;--accent-ink:#fff;--now:#e6f4eb;--a:#1d5ea8;--b:#b4432a;--warn:#9a5800;--danger:#b3261e;--red:#c0362c;--red-ink:#fff;--now-red:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1c201f;--ink:#eef2ef;--muted:#9aa49f;--line:#333a37;--accent:#43b37a;--accent-ink:#06130c;--now:#183024;--a:#86b8f0;--b:#f2977f;--warn:#f0b35a;--danger:#ff8a80;--red:#ef6b5f;--red-ink:#1f0806;--now-red:#3a1c1b}}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.7rem;margin:.3em 0 .2em}
h2{font-size:1.2rem;margin:1.2em 0 .5em}
.sub{color:var(--muted);font-size:1rem;margin:0 0 .6em}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:.5em .9em}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.big{width:100%;font-size:1.3rem;padding:.7em}
textarea,input{font:inherit;font-size:1.2rem;width:100%;padding:.5em .6em;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:9em}
.row{display:flex;gap:10px;align-items:stretch}
.row input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:.4em;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.25em .3em .25em .8em;font-size:1.15rem}
.chip small{color:var(--muted);font-size:.85rem}
.chip button{border:none;background:transparent;color:var(--danger);font-size:1.2rem;padding:0 .35em;line-height:1}
.note{color:var(--warn);font-size:1rem;margin:.6em 0}
.match{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.match.now{background:var(--now);border-color:var(--accent);border-width:3px;overflow:hidden}
.match.now .mh{background:var(--accent);color:var(--accent-ink);margin:-14px -16px 8px;padding:10px 16px}
.match.now .mh .no{color:var(--accent-ink);font-size:1.5rem}
.match.next{border-style:dashed;background:transparent}
.match.next .team{font-size:1.3rem}
/* 奇數場綠色、偶數場紅色，一眼看出有沒有按錯 */
.match{--theme:var(--accent);--theme-ink:var(--accent-ink);--theme-bg:var(--now)}
.match.even{--theme:var(--red);--theme-ink:var(--red-ink);--theme-bg:var(--now-red)}
.match.now{background:var(--theme-bg);border-color:var(--theme)}
.match.now .mh{background:var(--theme);color:var(--theme-ink)}
.match.now .mh .no{color:var(--theme-ink)}
.match.now .tag{background:var(--theme-ink);color:var(--theme)}
.match.now button.primary{background:var(--theme);border-color:var(--theme);color:var(--theme-ink)}
.match.next{border-color:var(--theme)}
.match.next .mh span:first-child{color:var(--theme);font-weight:700}
.lastdone.even b{color:var(--red)}
.match.flash{animation:flash .9s ease-out}
@keyframes flash{0%{transform:scale(.97);box-shadow:0 0 0 8px var(--theme)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
.lastdone{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;margin:12px 0;color:var(--muted)}
.lastdone .txt{flex:1;min-width:0;font-size:1rem}
.lastdone b{color:var(--accent)}
.lastdone button{font-size:1rem;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:.6em 1.2em;border-radius:999px;font-weight:700;text-align:center;pointer-events:none;z-index:9;animation:toast 2.6s forwards}
@keyframes toast{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.match.flash{animation:none}}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;color:var(--muted)}
.mh .no{font-weight:700;color:var(--ink);font-size:1.2rem}
.tag{background:var(--accent-ink);color:var(--accent);border-radius:999px;padding:.1em .7em;font-size:.95rem;font-weight:700}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0 4px;text-align:center}
.team{font-size:1.6rem;font-weight:700;line-height:1.25;word-break:break-all}
.ta{color:var(--a)}.tb{color:var(--b)}
.vs{color:var(--muted);font-weight:700;font-size:1rem}
.rest{color:var(--muted);font-size:1.05rem;text-align:center}
.match.now .team{font-size:1.9rem}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{flex:1}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.tools button{flex:1;min-width:140px;font-size:1rem}
.danger{color:var(--danger)}
.intro{font-size:1.1rem;margin:.2em 0 1em}
h3{font-size:1.1rem;margin:1em 0 .3em}
.rules{padding-left:1.3em;margin:.3em 0;font-size:1.05rem}
.rules li{margin:.35em 0}
.small{color:var(--muted);font-size:.95rem}
.help{margin-top:20px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.counter{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:12px 0}
.counter .label{flex:1;font-size:1.2rem;font-weight:700}
.counter button{width:2.4em;height:2.4em;padding:0;font-size:1.3rem;font-weight:700}
.counter .num{min-width:2em;text-align:center;font-size:1.8rem;font-weight:700}
.total{background:var(--now);border:3px solid var(--accent);border-radius:16px;padding:16px;margin:16px 0;text-align:center}
.formula{color:var(--muted);font-size:1.1rem}
.money{font-size:2.4rem;font-weight:800;margin:.1em 0}
.fees{display:flex;gap:10px;margin:12px 0}
.fees label{flex:1;min-width:0;color:var(--muted);font-size:1rem}
.fees input{margin-top:4px}
.help summary{cursor:pointer;font-weight:700;font-size:1.1rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = 'badminton-v1';
const TOTAL = 20;      // 預先排好 20 場（讓輪替更平均），畫面只顯示現在和下一場
const SHOW = 2;
const FEES_KEY = 'badminton-fees';
const MAX_PLAYERS = 12;

// 場地費、每顆球價；可在結算畫面修改，另外存起來，全部重來也會沿用
let FEES = loadFees();

function loadFees() {
  try {
    const f = JSON.parse(localStorage.getItem(FEES_KEY));
    if (f && f.court >= 0 && f.ball >= 0) return f;
  } catch (e) {}
  return { court: 550 * 2, ball: 56 };
}

function setFee(k, v) {
  const n = Math.round(Number(v));
  if (v !== '' && n >= 0) {
    FEES[k] = n;
    try { localStorage.setItem(FEES_KEY, JSON.stringify(FEES)); } catch (e) {}
  }
  render();
}

let S = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.players)) { s.upcoming = (s.upcoming || []).slice(0, TOTAL); return s; }
  } catch (e) {}
  return { players: [], history: [], upcoming: [], nextId: 1 };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const activeIds = () => S.players.filter(p => p.active).map(p => p.id);
const nameOf = id => (S.players.find(p => p.id === id) || {}).name || '?';
const pk = (x, y) => (x < y ? x + '|' + y : y + '|' + x);
const inc = (o, k) => { o[k] = (o[k] || 0) + 1; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- 排程邏輯 ----------

// 依已打完的場次算出每個人目前的狀態
function baseState() {
  const st = { games: {}, play: {}, rest: {}, partner: {}, opp: {}, last: null };
  for (const p of S.players) { st.games[p.id] = p.base || 0; st.play[p.id] = 0; st.rest[p.id] = 0; }
  // 中途加入的人，搭檔／對手次數從大家的平均起算，不然跟他搭都算「新組合」，會一直被排上場
  for (const x of S.players) for (const y of S.players) if (x.id < y.id) {
    const sp = Math.max(x.pbase || 0, y.pbase || 0), so = Math.max(x.obase || 0, y.obase || 0);
    if (sp) st.partner[pk(x.id, y.id)] = sp;
    if (so) st.opp[pk(x.id, y.id)] = so;
  }
  for (const h of S.history) apply(st, h, h.present);
  return st;
}

function apply(st, m, ids) {
  const on = new Set([...m.a, ...m.b]);
  for (const id of ids) {
    if (on.has(id)) { st.games[id] = (st.games[id] || 0) + 1; st.play[id] = (st.play[id] || 0) + 1; st.rest[id] = 0; }
    else { st.rest[id] = (st.rest[id] || 0) + 1; st.play[id] = 0; }
  }
  inc(st.partner, pk(m.a[0], m.a[1]));
  inc(st.partner, pk(m.b[0], m.b[1]));
  for (const x of m.a) for (const y of m.b) inc(st.opp, pk(x, y));
  st.last = m;
}

const clone = st => JSON.parse(JSON.stringify(st));

function candidates(ids) {
  const out = [], n = ids.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
    for (let k = j + 1; k < n; k++) for (let l = k + 1; l < n; l++) {
      const p = ids[i], q = ids[j], r = ids[k], s = ids[l];
      out.push({ a: [p, q], b: [r, s] }, { a: [p, r], b: [q, s] }, { a: [p, s], b: [q, r] });
    }
  return out;
}

// 分數越低越好
function cost(st, m, ids) {
  const on = new Set([...m.a, ...m.b]);
  let c = 0;
  for (const id of ids) {
    if (on.has(id)) {
      if (st.play[id] >= 2) c += 1000 * (st.play[id] - 1); // 規則 2：不連續上場超過 2 場
      c += st.games[id] * 12;            // 場數平均
    } else if (st.rest[id] >= 2) c += 1000 * (st.rest[id] - 1); // 規則 3：不休息超過 2 場
  }
  // 規則 1：搭檔不重複（重複越多次扣越重）
  const pa = st.partner[pk(m.a[0], m.a[1])] || 0, pb = st.partner[pk(m.b[0], m.b[1])] || 0;
  c += 40 * (pa * pa + pa + pb * pb + pb);
  for (const x of m.a) for (const y of m.b) c += 6 * (st.opp[pk(x, y)] || 0);
  if (st.last) {
    const L = new Set([...st.last.a, ...st.last.b]);
    if ([...on].every(x => L.has(x))) c += 30; // 避免同樣 4 人連續兩場
  }
  return c;
}

const validFor = (m, ids) => [...m.a, ...m.b].every(id => ids.includes(id));

// 保留 fixed 這幾場，後面補到 TOTAL 場
function plan(fixed) {
  const ids = activeIds();
  if (ids.length < 4) return [];
  fixed = fixed.filter(m => validFor(m, ids));
  const base = baseState();
  for (const m of fixed) apply(base, m, ids);
  const need = TOTAL - fixed.length;
  if (need <= 0) return fixed.slice(0, TOTAL);
  const cands = candidates(ids);
  const restarts = need === 1 ? 1 : (ids.length > 8 ? 12 : 40);
  let best = null, bestC = Infinity;
  for (let r = 0; r < restarts; r++) {
    const st = clone(base), seq = [];
    let tot = 0;
    for (let g = 0; g < need; g++) {
      let bm = null, bc = Infinity, braw = 0;
      for (const m of cands) {
        const raw = cost(st, m, ids);
        const c = raw + Math.random() * (r ? 10 : 0.5);
        if (c < bc) { bc = c; bm = m; braw = raw; }
      }
      tot += braw; seq.push(bm); apply(st, bm, ids);
    }
    if (tot < bestC) { bestC = tot; best = seq; }
  }
  return fixed.concat(best.map(m => ({ a: [...m.a], b: [...m.b] })));
}

// ---------- 動作 ----------

function parseNames(text) {
  const seen = new Set();
  // 編號後面不能直接接數字，避免把「10.12」「8:00」這種日期、時間標題當成編號
  const numbered = /^\s*\d+\s*(?:[.、)）:：]\s*|\s+)(?!\d)/;
  let lines = text.split(/[\n\r]+/);
  // 接龍格式：只要有編號的行，就忽略沒編號的標題／備註
  if (lines.some(l => numbered.test(l))) lines = lines.filter(l => numbered.test(l));
  // 一行一位（或逗號分隔），去掉前面的「1.」編號；名字中間可以有空白
  return lines.map(l => l.replace(numbered, '')).join('\n').split(/[\n\r,，、;；]+/)
    .map(s => s.replace(/\s+/g, ' ').trim())
    .filter(s => s && !seen.has(s) && seen.add(s));
}

function start() {
  const names = parseNames(document.getElementById('names').value);
  if (names.length < 4) return alert('至少需要 4 位選手');
  if (names.length > MAX_PLAYERS) return alert('最多 ' + MAX_PLAYERS + ' 位選手');
  S = { players: names.map((n, i) => ({ id: i + 1, name: n, active: true, base: 0 })), history: [], upcoming: [], nextId: names.length + 1 };
  S.upcoming = plan([]);
  commit();
}

// 進行中的這場若仍有效就保留，後面重排
function replanKeepingCurrent() {
  const ids = activeIds();
  const cur = S.upcoming[0];
  S.upcoming = plan(cur && validFor(cur, ids) ? [cur] : []);
}

let lastFinish = 0, flash = false; // flash：剛按完「這場打完了」，下次畫面要提示

function finishMatch() {
  const m = S.upcoming[0];
  if (!m) return;
  // 防止手滑連按兩下，一次跳過兩場
  if (Date.now() - lastFinish < 1500) return;
  lastFinish = Date.now();
  flash = true;
  S.history.push({ a: m.a, b: m.b, present: activeIds() });
  S.upcoming = plan(S.upcoming.slice(1));
  commit();
}

function undo() {
  const h = S.history[S.history.length - 1];
  if (!h) return;
  // 復原的這場要能重新排進去，否則會直接消失
  if (activeIds().length < 4 || !validFor(h, activeIds())) return alert('上一場有人已經退出，無法復原');
  S.history.pop();
  S.upcoming = plan([{ a: h.a, b: h.b }]);
  commit();
}

function addPlayer() {
  const input = document.getElementById('newName');
  const names = parseNames(input.value);
  if (!names.length) return;
  const st = baseState();
  const ids = activeIds();
  // 新加入的人以目前的平均場數（四捨五入）起算，跟大家一樣正常輪替，不會為了追場數一直被排上場
  const base = ids.length ? Math.round(ids.reduce((s, id) => s + st.games[id], 0) / ids.length) : 0;
  // 目前在場的人之間，平均搭檔／對手過幾次
  const pairAvg = o => {
    let sum = 0, cnt = 0;
    for (const x of ids) for (const y of ids) if (x < y) { sum += o[pk(x, y)] || 0; cnt++; }
    return cnt ? sum / cnt : 0;
  };
  const pbase = Math.round(pairAvg(st.partner)), obase = Math.round(pairAvg(st.opp));
  let changed = false;
  for (const n of names) {
    if (S.players.some(p => p.active && p.name === n)) { alert(n + ' 已經在名單裡了'); continue; }
    if (activeIds().length >= MAX_PLAYERS) { alert('最多 ' + MAX_PLAYERS + ' 位選手'); break; }
    // 退出後再回來的人沿用原本的紀錄（場數、搭檔），不足的部分一樣補到大家的平均
    const back = S.players.find(p => !p.active && p.name === n);
    if (back) {
      const mine = o => {
        let sum = 0; for (const x of ids) sum += o[pk(x, back.id)] || 0; return ids.length ? sum / ids.length : 0;
      };
      back.active = true;
      back.base = (back.base || 0) + Math.max(0, base - st.games[back.id]);
      back.pbase = (back.pbase || 0) + Math.max(0, Math.round(pbase - mine(st.partner)));
      back.obase = (back.obase || 0) + Math.max(0, Math.round(obase - mine(st.opp)));
    }
    else { S.players.push({ id: S.nextId++, name: n, active: true, base, pbase, obase }); delete S.heads; } // 新名字加入，人頭回到預設
    changed = true;
  }
  if (!changed) return; // 都是重複的名字，不要打亂後面的場次
  replanKeepingCurrent();
  commit();
}

function removePlayer(id) {
  if (!confirm('確定讓「' + nameOf(id) + '」退出？')) return;
  S.players.find(p => p.id === id).active = false;
  replanKeepingCurrent();
  commit();
}

function reshuffle() {
  if (!confirm('重新排列之後的所有場次？')) return;
  S.upcoming = plan([]);
  commit();
}

function resetAll() {
  if (!confirm('清除所有選手和紀錄，重新開始？')) return;
  const names = S.players.filter(p => p.active).map(p => p.name).join('\n');
  S = { players: [], history: [], upcoming: [], nextId: 1 };
  commit();
  document.getElementById('names').value = names;
}

function changeBalls(d) {
  S.balls = Math.max(0, (S.balls || 0) + d);
  commit();
}

// 人頭預設 = 今天名單上所有人（含中途離開的）
const defaultHeads = () => new Set(S.players.map(p => p.name)).size;
const heads = () => S.heads || defaultHeads();
const perPerson = () => (FEES.court + FEES.ball * (S.balls || 0)) / heads();

function changeHeads(d) {
  S.heads = Math.max(1, heads() + d);
  commit();
}

function endSession() {
  if (!confirm('比賽結束，開始結算？')) return;
  S.ended = true;
  commit();
  scrollTo(0, 0);
}

function resumeSession() {
  S.ended = false;
  commit();
}

function summaryText() {
  const x = S.balls || 0, y = heads();
  return `🏸 今日結算\n打了 ${S.history.length} 場，用球 ${x} 顆，${y} 人\n` +
    `(${FEES.court} + ${FEES.ball} × ${x}) ÷ ${y} = ${Math.ceil(perPerson())} 元/人`;
}

function copySummary() {
  const t = summaryText();
  const ok = () => alert('已複製，可以貼到群組');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => prompt('請手動複製', t));
  else prompt('請手動複製', t);
}

function commit() { save(); render(); }

// ---------- 畫面 ----------

const RULES = `
  <h3>排場規則</h3>
  <ul class="rules">
    <li><b>搭檔不重複</b>：盡量讓每個人輪流跟不同的人搭檔，對手也盡量分散。</li>
    <li><b>不連續上場超過 2 場</b>：打完兩場盡量排休息。</li>
    <li><b>不連續休息超過 2 場</b>：休息兩場後盡量排上場。</li>
    <li><b>場數平均</b>：每個人打的場數盡量一樣。</li>
  </ul>
  <p class="small">※ 只有 4–5 人時，每場能休息的人太少，無法完全做到「不連續上場超過 2 場」，會盡量平均分配。</p>
  <h3>怎麼用</h3>
  <ol class="rules">
    <li>貼上選手名單，按「產生分配表」，畫面會顯示<b>現在這場</b>（綠色）和<b>下一場</b>（虛線框）。</li>
    <li>每打完一場，按「✓ 這場打完了」，下一場就會變成綠色的「進行中」，剛打完的那場會縮小顯示在最上面，標示「✓ 已結束」；按錯可以按旁邊的「↶ 復原」。</li>
    <li>有人中途加入，在上方輸入名字按「＋ 加入」；有人要走，按名字旁的 ✕。正在打的這場不變，後面的場次會自動重新安排。</li>
    <li>每開一顆新球，按「用球數」的 ＋。</li>
    <li>打完按最下面的「🏁 比賽結束」，自動算出每人費用：(場地費 + 每顆球價 × 用球數) ÷ 人頭。人頭預設是今天名單上所有人（含中途離開的），可以再調整；場地費和球價也可以在結算畫面修改，下次會沿用。</li>
    <li>資料存在這支手機的瀏覽器裡，重新整理也不會不見。</li>
  </ol>`;

function render() {
  const app = document.getElementById('app');
  const ids = activeIds();
  if (!S.players.length) {
    app.innerHTML = `
      <h1>🏸 羽球分組表</h1>
      <p class="intro">雙打輪替排場小幫手（一面場地，4–12 人）。貼上名單，自動排好每一場誰跟誰打、誰休息，讓大家公平輪流上場。</p>
      <p class="sub">貼上選手名單，一行一位，前面的「1.」編號會自動去掉</p>
      <textarea id="names" placeholder="1. felix&#10;2. Emily&#10;3. Mango&#10;4. Andy"></textarea>
      <div style="height:12px"></div>
      <button class="primary big" onclick="start()">產生分配表</button>
      <details class="help"><summary>規則說明</summary>${RULES}</details>`;
    return;
  }
  if (S.ended) {
    const x = S.balls || 0, y = heads(), each = perPerson();
    const played = [...new Set(S.players.map(p => p.name))].map(n => {
      const pids = S.players.filter(p => p.name === n).map(p => p.id);
      const g = S.history.filter(h => [...h.a, ...h.b].some(id => pids.includes(id))).length;
      return `<span class="chip">${esc(n)} <small>${g} 場</small></span>`;
    }).join('');
    app.innerHTML = `
      <h1>🏁 今日結算</h1>
      <p class="sub">共打了 ${S.history.length} 場</p>
      <div class="counter"><span class="label">用球數</span>
        <button aria-label="用球數減一" onclick="changeBalls(-1)">−</button><span class="num">${x}</span><button aria-label="用球數加一" onclick="changeBalls(1)">＋</button></div>
      <div class="counter"><span class="label">人頭</span>
        <button aria-label="人頭減一" onclick="changeHeads(-1)">−</button><span class="num">${y}</span><button aria-label="人頭加一" onclick="changeHeads(1)">＋</button></div>
      <div class="fees">
        <label>場地費<input type="number" inputmode="numeric" min="0" value="${FEES.court}" onchange="setFee('court', this.value)"></label>
        <label>每顆球<input type="number" inputmode="numeric" min="0" value="${FEES.ball}" onchange="setFee('ball', this.value)"></label>
      </div>
      <div class="total">
        <div class="formula">(${FEES.court} + ${FEES.ball} × ${x}) ÷ ${y}${Number.isInteger(each) ? '' : ' = ' + each.toFixed(1)}</div>
        <div class="money">每人 ${Math.ceil(each)} 元</div>
        ${Number.isInteger(each) ? '' : '<div class="small">（小數無條件進位）</div>'}
      </div>
      <button class="primary big" onclick="copySummary()">📋 複製結算文字</button>
      <h2>今日出場</h2>
      <div class="chips">${played}</div>
      <div class="tools">
        <button onclick="resumeSession()">↶ 回到分配表</button>
        <button class="danger" onclick="resetAll()">全部重來</button>
      </div>`;
    return;
  }
  const chips = ids.map(id => `
    <span class="chip">${esc(nameOf(id))} <small>${S.history.filter(h => [...h.a, ...h.b].includes(id)).length} 場</small>
      <button aria-label="退出" title="退出" onclick="removePlayer(${id})">✕</button></span>`).join('');
  let notes = '';
  if (ids.length < 4) notes = `<p class="note">目前只有 ${ids.length} 人，至少需要 4 人才能排場。</p>`;
  else if (ids.length <= 5) notes = `<p class="note">${ids.length} 人時每場最多只有 ${ids.length - 4} 人休息，無法完全避免連續上場超過 2 場，會盡量平均。</p>`;

  const done = S.history.length;
  const team = t => t.map(nameOf).map(esc).join('<br>');
  const cards = S.upcoming.slice(0, SHOW).map((m, i) => {
    const on = new Set([...m.a, ...m.b]);
    const rest = ids.filter(id => !on.has(id)).map(nameOf).map(esc).join('、');
    const now = i === 0;
    return `
      <div class="match ${now ? 'now' : 'next'} ${(done + i + 1) % 2 ? 'odd' : 'even'}${now && flash ? ' flash' : ''}">
        <div class="mh">${now
          ? `<span class="no">▶ 第 ${done + 1} 場</span><span class="tag">進行中</span>`
          : `<span>下一場 · 第 ${done + 2} 場</span><span>準備</span>`}</div>
        <div class="teams">
          <div class="team ta">${team(m.a)}</div>
          <div class="vs">VS</div>
          <div class="team tb">${team(m.b)}</div>
        </div>
        <div class="rest">${rest ? '休息：' + rest : '全員上場'}</div>
        ${now ? `<div class="actions">
          <button class="primary" style="font-size:1.3rem" onclick="finishMatch()">✓ 這場打完了</button>
        </div>` : ''}
      </div>`;
  }).join('');
  // 剛打完的那場縮小顯示，一眼看出已經按過「這場打完了」
  const last = S.history[done - 1];
  const lastRow = last ? `
    <div class="lastdone ${done % 2 ? 'odd' : 'even'}">
      <span class="txt"><b>✓ 第 ${done} 場已結束</b><br>${last.a.map(nameOf).map(esc).join('、')} vs ${last.b.map(nameOf).map(esc).join('、')}</span>
      <button onclick="undo()">↶ 復原</button>
    </div>` : '';
  const toast = flash ? `<div class="toast" role="status">✓ 第 ${done} 場結束，換第 ${done + 1} 場</div>` : '';
  flash = false;

  app.innerHTML = `
    <h1>🏸 羽球分組表</h1>
    <p class="sub">已打完 ${done} 場 · ${ids.length} 人</p>
    ${lastRow}
    ${cards}
    <h2>選手</h2>
    <div class="chips">${chips}</div>
    <div style="height:12px"></div>
    <div class="row">
      <input id="newName" placeholder="新加入的選手" onkeydown="if(event.key==='Enter')addPlayer()">
      <button class="primary" onclick="addPlayer()">＋ 加入</button>
    </div>
    ${notes}
    <div class="counter"><span class="label">用球數</span>
      <button aria-label="用球數減一" onclick="changeBalls(-1)">−</button><span class="num">${S.balls || 0}</span><button aria-label="用球數加一" onclick="changeBalls(1)">＋</button></div>
    <button class="primary big" style="margin-top:20px" onclick="endSession()">🏁 比賽結束</button>
    <div class="tools">
      <button onclick="reshuffle()">🔀 重新排列</button>
      <button class="danger" onclick="resetAll()">全部重來</button>
    </div>
    <details class="help"><summary>規則說明</summary>${RULES}</details>
    ${toast}`;
}

if (typeof document !== 'undefined') render();
</script>
</body>
</html>
